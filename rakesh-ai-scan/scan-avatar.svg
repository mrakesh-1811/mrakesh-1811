<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
 <defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855ff"/><stop offset=".48" stop-color="#20e8ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00eaff" stop-opacity="0"/><stop offset=".48" stop-color="#5af5ff" stop-opacity=".15"/><stop offset=".5" stop-color="#9bfaff" stop-opacity=".95"/><stop offset=".52" stop-color="#00cfff" stop-opacity=".3"/><stop offset="1" stop-color="#00eaff" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="18" y="18" width="484" height="484" rx="26"/></clipPath>
 </defs>
 <rect width="520" height="520" rx="32" fill="#060913"/>
 <g clip-path="url(#clip)">
  <image href="assets/avatar-symbols.png" x="18" y="18" width="484" height="484" preserveAspectRatio="xMidYMid meet"/>
  <rect x="18" y="-110" width="484" height="115" fill="url(#beam)" filter="url(#glow)"><animate attributeName="y" from="-110" to="515" dur="3.4s" repeatCount="indefinite"/></rect>
  <path d="M18 0 H502" stroke="#42f2ff" stroke-width="2.2" opacity=".9" filter="url(#glow)"><animate attributeName="d" values="M18 0 H502;M18 625 H502;M18 0 H502" dur="3.4s" repeatCount="indefinite"/></path>
  <!-- moving scan spark particles -->
  <g fill="#67f3ff" filter="url(#glow)">
   <circle cx="62" cy="110" r="2"><animate attributeName="cy" values="110;405;110" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
   <circle cx="456" cy="180" r="1.8"><animate attributeName="cy" values="180;350;180" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="1.7s" repeatCount="indefinite"/></circle>
   <circle cx="92" cy="340" r="1.5"><animate attributeName="cy" values="340;95;340" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.9;.1" dur="2.4s" repeatCount="indefinite"/></circle>
   <circle cx="414" cy="440" r="2"><animate attributeName="cy" values="440;80;440" dur="3.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>
 </g>
 <rect x="18" y="18" width="484" height="484" rx="26" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>
 <!-- corner scanner marks -->
 <g stroke="#66eaff" stroke-width="3" fill="none" filter="url(#glow)"><path d="M35 72 V38 H72 M448 38 H485 V72 M35 448 V485 H72 M448 485 H485 V448"/></g>
 <g font-family="monospace" font-size="13" fill="#8eeeff"><text x="40" y="58">INITIALIZING RAKESH AI<tspan>...</tspan><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></text><text x="390" y="478">FACE SCAN<tspan> </tspan><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></text></g>
 <g fill="#b5f8ff" font-family="monospace" font-size="16"><text x="475" y="58">+</text><text x="38" y="475">+</text></g>
</svg>
